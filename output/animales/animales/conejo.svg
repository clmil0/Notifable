    <ellipse class="acento-suave" cx="181" cy="328" rx="10" ry="8"/>
    <circle class="acento-suave" cx="167" cy="314" r="4.5"/><circle class="acento-suave" cx="179" cy="308" r="4.5"/><circle class="acento-suave" cx="192" cy="313" r="4.5"/>
  </g>
  <g id="aleta-der">
