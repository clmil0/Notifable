    <circle cx="309" cy="343" r="8" fill="#fff"/>
    <circle cx="327" cy="362" r="3.5" fill="#fff"/>
    <circle cx="440" cy="355" r="24" fill="#1e1a6b"/>
    <circle cx="431" cy="346" r="8" fill="#fff"/>
    <circle cx="449" cy="365" r="3.5" fill="#fff"/>
